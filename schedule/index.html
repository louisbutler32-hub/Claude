<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posting Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style id="css">
/* Layout idea: a broadcast run-sheet. Header + tabs, then one working view (next 14 days, month grid, or channel rules). */
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --ink: #16181d;
  --muted: #5d6370;
  --line: #dde0e6;
  --accent: #d93a2b;       /* on-air red */
  --accent-ink: #ffffff;
  --soft: #eceef2;
  --ok: #1f8a4c;
  --warn: #b7791f;
  --bad: #c62828;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --panel: #1a1d24; --ink: #eef0f4; --muted: #9aa1ae; --line: #2c313b;
    --accent: #ff5a47; --accent-ink: #16181d; --soft: #232731;
    --ok: #4cc27f; --warn: #e3a948; --bad: #ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --panel: #1a1d24; --ink: #eef0f4; --muted: #9aa1ae; --line: #2c313b;
  --accent: #ff5a47; --accent-ink: #16181d; --soft: #232731;
  --ok: #4cc27f; --warn: #e3a948; --bad: #ff6b6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }

header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1180px; margin: 0 auto; padding: 12px 16px 0; display: grid; gap: 10px; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font: 800 22px/1.1 var(--font-display); letter-spacing: .01em; margin: 0; text-wrap: balance; display: flex; align-items: center; gap: 10px; }
.onair { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.sub { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.status { font-size: 12px; color: var(--muted); }
.status.saving { color: var(--warn); }
.status.err { color: var(--bad); }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 12px 10px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 8px; font-weight: 500; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 3px 9px; font-size: 13px; border-radius: 6px; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }

/* summary tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 18px 0; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font: 800 24px/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.tile .v small { font: 500 12px var(--font-body); color: var(--muted); margin-left: 4px; }
.tile.flag .v { color: var(--bad); }

/* load meter: one segment per allowed post */
.meter { display: inline-flex; gap: 2px; vertical-align: middle; }
.meter i { width: 7px; height: 12px; border-radius: 2px; background: var(--soft); border: 1px solid var(--line); }
.meter i.l { background: var(--ink); border-color: var(--ink); }
.meter i.s { background: var(--muted); border-color: var(--muted); opacity: .55; }
.meter i.over { background: var(--bad); border-color: var(--bad); }

/* agenda */
.agenda { display: grid; gap: 12px; margin-top: 18px; }
.day { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.day-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.day-head h3 { margin: 0; font: 800 16px/1.2 var(--font-display); }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.pill.accent { background: var(--accent); color: var(--accent-ink); }
.pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.counts { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { padding: 12px 14px; color: var(--muted); font-size: 14px; }

.row { display: grid; grid-template-columns: auto 6px 1fr auto; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); }
.day-head + .row { border-top: 0; }
.row .bar { width: 6px; align-self: stretch; border-radius: 3px; }
.row.short .bar { width: 4px; margin-left: 1px; }
.row .name { font-weight: 600; }
.row .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kind { font: 600 10.5px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; }
.kind.long { background: var(--ink); color: var(--panel); }
.kind.short { border: 1px solid var(--muted); color: var(--muted); padding: 2px 5px; }
.time { font-family: var(--font-mono); font-size: 12px; }
.row.done .name { text-decoration: line-through; color: var(--muted); }
.row.skip { opacity: .55; }
.row.skip .name { text-decoration: line-through; }
.acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.check { width: 22px; height: 22px; accent-color: var(--ok); margin: 0; }
.movebox { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 0 2px 32px; }
.movebox button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.movebox button:hover { border-color: var(--ink); }
.movebox button.full { color: var(--bad); }
.movebox button.cur { border-color: var(--accent); }

/* month grid */
.month-bar { display: flex; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.month-bar h2 { font: 800 22px/1 var(--font-display); margin: 0 6px; min-width: 9ch; text-wrap: balance; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.dow { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 0 4px; }
.cell { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 132px; padding: 6px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.cell:hover { border-color: var(--muted); }
.cell.out { opacity: .45; }
.cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cell.over { background: color-mix(in srgb, var(--bad) 7%, var(--panel)); }
.cell .top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.cell .num { font: 800 15px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-direction: column; gap: 2px; }
.chip { display: flex; align-items: center; gap: 5px; font-size: 11.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .sw { flex: none; width: 9px; height: 9px; border-radius: 2px; }
.chip.short .sw { width: 5px; height: 11px; border-radius: 3px; }
.chip.done { color: var(--muted); text-decoration: line-through; }
.chip.skip { display: none; }
.chip.opt { font-style: italic; }
.dots { display: none; flex-wrap: wrap; gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; }
.dots i.short { border-radius: 2px; width: 5px; height: 9px; }
.dots i.done { opacity: .3; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; }
.legend .short .sw { width: 5px; height: 12px; border-radius: 3px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 20; display: flex; justify-content: flex-end; }
.sheet { background: var(--panel); width: min(460px, 100%); height: 100%; overflow-y: auto; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.sheet-head { position: sticky; top: 0; background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 14px; border-bottom: 1px solid var(--line); z-index: 1; }
.sheet-head h3 { margin: 0; font: 800 18px/1.2 var(--font-display); flex: 1; }
.sheet .day { border: 0; border-radius: 0; }
.sheet-body { padding: 0 0 20px; }
.sheet-note { padding: 10px 14px; font-size: 13px; color: var(--muted); }

/* channels */
.section-h { font: 800 18px/1.2 var(--font-display); margin: 26px 0 4px; }
.section-p { color: var(--muted); margin: 0 0 12px; max-width: 70ch; font-size: 14px; }
.limits { display: flex; flex-wrap: wrap; gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; align-items: end; }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
label.f input, label.f select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 8px; font-size: 14px; color: var(--ink); min-width: 0; }
label.f input[type="number"] { width: 72px; }
label.f input[type="color"] { padding: 2px; width: 44px; height: 34px; }
.chlist { display: grid; gap: 10px; }
.ch { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
.ch.off { opacity: .6; }
.ch-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ch-head .nm { font: 800 16px/1.2 var(--font-display); flex: 1; min-width: 160px; }
.ch-fields { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.wdays { display: inline-flex; gap: 3px; }
.wdays button { width: 34px; padding: 5px 0; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); font-size: 12.5px; font-weight: 600; color: var(--muted); }
.wdays button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.switch input { width: 18px; height: 18px; accent-color: var(--ok); }
.rate { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rate b { color: var(--ink); }
.note { font-size: 12.5px; color: var(--muted); }

table.week { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--panel); }
table.week th, table.week td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
table.week th:first-child, table.week td:first-child { text-align: left; white-space: nowrap; }
table.week td.on { font-weight: 600; }
table.week tfoot td { font-weight: 700; }
table.week td.bad { color: var(--bad); }
.tablewrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); }
.tablewrap table { border-style: hidden; }

/* export modal */
.modal { background: var(--panel); margin: auto; width: min(520px, calc(100% - 32px)); border-radius: 14px; border: 1px solid var(--line); padding: 18px; display: grid; gap: 12px; }
.scrim.center { justify-content: center; align-items: center; }
.modal h3 { margin: 0; font: 800 18px/1.2 var(--font-display); }
.modal p { margin: 0; color: var(--muted); font-size: 14px; }
.modal textarea { width: 100%; height: 140px; font: 12px/1.4 var(--font-mono); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.modal .row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.msg { font-size: 13px; color: var(--ok); min-height: 1em; }
.msg.err { color: var(--bad); }

@media (max-width: 760px) {
  .cell { min-height: 74px; padding: 5px; }
  .chips { display: none; }
  .dots { display: flex; }
  .cell .meter { display: none; }
  .grid { gap: 4px; }
  .row { gap: 8px; padding: 9px 10px; }
  .row .acts .btn { padding: 3px 6px; }
  .movebox { padding-left: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* ---------- results tracker ---------- */
.res-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 18px; }
.banner { margin-top: 14px; padding: 10px 14px; border-radius: 10px; border: 1px dashed var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--panel)); font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.ins { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.ins.good { border-left-color: var(--ok); }
.ins.fix { border-left-color: var(--warn); }
.ins h4 { margin: 0 0 3px; font: 600 12px/1.3 var(--font-body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.ins p { margin: 0; }
.ins button.linkish { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
table.lb { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; background: var(--panel); }
table.lb th, table.lb td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.lb th { font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
table.lb th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; }
table.lb th button[aria-sort] { color: var(--ink); }
table.lb td.t, table.lb th.t { text-align: left; white-space: normal; min-width: 220px; }
table.lb tbody tr { cursor: pointer; }
table.lb tbody tr:hover { background: var(--soft); }
table.lb .vt { font-weight: 600; }
table.lb .vs { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; }
.hi { color: var(--ok); font-weight: 600; }
.lo { color: var(--bad); }
.score { font-weight: 700; }
.tagchip { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.charts { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; position: relative; }
.card h3 { margin: 0 0 2px; font: 800 15px/1.2 var(--font-display); }
.card .cap { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
.card svg { width: 100%; height: auto; display: block; }
.card svg text { fill: var(--muted); font: 11px var(--font-body); }
.card svg .grid { stroke: var(--line); stroke-width: 1; }
.card svg .med { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
.card svg .q { fill: var(--ink); font-weight: 600; opacity: .55; }
.card svg circle.dot { fill: var(--ink); stroke: var(--panel); stroke-width: 2; cursor: pointer; }
.card svg circle.dot:hover, .card svg circle.dot.on { fill: var(--accent); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12px; padding: 6px 8px; border-radius: 6px; max-width: 240px; z-index: 3; }
.bars { display: grid; gap: 6px; }
.bars .b { display: grid; grid-template-columns: minmax(90px, 140px) 1fr auto; gap: 8px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.bars .b .nm { display: flex; gap: 6px; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .track { height: 12px; }
.bars .fill { height: 12px; background: var(--ink); border-radius: 0 4px 4px 0; min-width: 2px; opacity: .8; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.form .wide { grid-column: 1 / -1; }
.form label.f input, .form label.f select, .form label.f textarea { width: 100%; }
label.f textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 8px; font: 14px var(--font-body); color: var(--ink); min-height: 60px; }
.modal.big { width: min(720px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; }
.modal ol { margin: 0; padding-left: 20px; font-size: 14px; color: var(--muted); display: grid; gap: 3px; }
.fieldset-h { grid-column: 1 / -1; font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 4px; }
@media (max-width: 760px) { .charts { grid-template-columns: 1fr; } .card svg text { font-size: 17px; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="saved-state">null</script>
<script id="app">
"use strict";
/* ================= ENGINE (pure: dates + planner) ================= */
const DAY = 86400000;
const WD = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function toNum(s) { const [y, m, d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); }
function toStr(n) { return new Date(n * DAY).toISOString().slice(0, 10); }
function wd(n) { return ((n + 3) % 7 + 7) % 7; }            /* Mon = 0 … Sun = 6 */
function monday(n) { return n - wd(n); }
function todayNum() { const t = new Date(); return Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DAY); }
function ymd(n) { const d = new Date(n * DAY); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() }; }

function combos(arr, k) {
  const out = [];
  const rec = (s, cur) => {
    if (cur.length === k) { out.push(cur.slice()); return; }
    for (let i = s; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
  };
  rec(0, []);
  return out;
}

/* Plan one Monday-to-Sunday week. Fixed rules (every-N-days, set weekdays) go
   down first; "N per week" channels are then placed on the combination of days
   that keeps the daily load lowest and the posts evenly spaced, honouring the
   daily caps, preferred days, and link groups (linked channels avoid sharing a day). */
function planWeek(cfg, mon) {
  const L = cfg.limits;
  const posts = [];
  const tot = [0,0,0,0,0,0,0], lng = [0,0,0,0,0,0,0], sht = [0,0,0,0,0,0,0];
  const onDay = [0,1,2,3,4,5,6].map(() => new Set());
  const linkOf = {};
  cfg.channels.forEach(c => { linkOf[c.id] = (c.link || "").trim().toLowerCase(); });
  const startOk = (c, n) => !c.start || n >= toNum(c.start);
  const add = (c, i, id, optional) => {
    posts.push({ id, ch: c.id, day: mon + i, optional: !!optional });
    tot[i]++; if (c.kind === "long") lng[i]++; else sht[i]++;
    onDay[i].add(c.id);
  };
  const active = cfg.channels.filter(c => c.enabled);

  for (const c of active) {
    const r = c.rule;
    if (r.type !== "rolling" && r.type !== "weekly") continue;
    for (let i = 0; i < 7; i++) {
      const n = mon + i;
      if (!startOk(c, n)) continue;
      let hit = false;
      if (r.type === "rolling") {
        const a = toNum(r.anchor), e = Math.max(1, Math.round(r.every || 1));
        hit = n >= a && (n - a) % e === 0;
      } else hit = (r.days || []).includes(i);
      if (hit) add(c, i, c.id + "|" + toStr(n));
    }
  }

  const dayCost = (c, i) => {
    let cost = 0;
    const t = tot[i] + 1;
    if (t > L.maxPerDay) cost += 1000 * (t - L.maxPerDay);
    cost += t * t;
    if (c.kind === "long") {
      const l = lng[i] + 1;
      if (l > L.maxLongPerDay) cost += 1000 * (l - L.maxLongPerDay);
      cost += 1.5 * l * l;
    } else {
      const s = sht[i] + 1; cost += s * s;
    }
    const lk = linkOf[c.id];
    if (lk) for (const o of onDay[i]) if (o !== c.id && linkOf[o] === lk) cost += 60;
    const pref = c.rule.prefer || [];
    if (pref.length && !pref.includes(i)) cost += 3;
    return cost;
  };

  const flex = active.filter(c => c.rule.type === "flex")
    .map((c, idx) => ({ c, idx }))
    .sort((a, b) => (a.c.kind === b.c.kind ? 0 : a.c.kind === "long" ? -1 : 1) || (b.c.rule.perWeek - a.c.rule.perWeek) || (a.idx - b.idx))
    .map(x => x.c);

  for (const c of flex) {
    const eligible = [0,1,2,3,4,5,6].filter(i => startOk(c, mon + i));
    const k = Math.min(Math.max(0, Math.round(c.rule.perWeek || 0)), eligible.length);
    if (!k) continue;
    let best = null;
    for (const D of combos(eligible, k)) {
      let cost = 0;
      for (const i of D) cost += dayCost(c, i);
      if (k > 1) {
        const ideal = 7 / k;
        for (let j = 0; j < k; j++) {
          const g = j < k - 1 ? D[j + 1] - D[j] : 7 - D[k - 1] + D[0];
          cost += 2 * (g - ideal) * (g - ideal);
        }
      }
      if (!best || cost < best.cost - 1e-9) best = { D, cost };
    }
    best.D.forEach((i, j) => add(c, i, c.id + "|w" + toStr(mon) + "|" + j));
  }

  /* optional extras ("1–2 a week"): only on days that still have room */
  for (const c of flex) {
    const extra = Math.round(c.rule.bonus || 0);
    if (!extra) continue;
    const used = new Set(posts.filter(p => p.ch === c.id).map(p => p.day - mon));
    for (let b = 0; b < extra; b++) {
      let best = null;
      for (let i = 0; i < 7; i++) {
        if (used.has(i) || !startOk(c, mon + i)) continue;
        if (tot[i] >= L.maxPerDay) continue;
        if (c.kind === "long" && lng[i] >= L.maxLongPerDay) continue;
        let near = 0;
        for (const u of used) { const g = Math.min(Math.abs(u - i), 7 - Math.abs(u - i)); if (g < 2) near += 4; }
        const cost = dayCost(c, i) + near;
        if (!best || cost < best.cost) best = { i, cost };
      }
      if (!best) break;
      used.add(best.i);
      add(c, best.i, c.id + "|w" + toStr(mon) + "|x" + b, true);
    }
  }
  return posts;
}
/* ================= END ENGINE ================= */

/* ================= STATE ================= */
const LS_KEY = "posting-schedule-v1";
const clone = o => JSON.parse(JSON.stringify(o));
function loadState() {
  let embedded = null, local = null;
  try { embedded = JSON.parse(document.getElementById("saved-state").textContent); } catch (e) {}
  try { local = JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) {}
  const pick = [embedded, local].filter(s => s && s.config && Array.isArray(s.config.channels))
    .sort((a, b) => (b.rev || 0) - (a.rev || 0))[0];
  const st = pick ? clone(pick) : { rev: 0, config: clone(DEFAULTS), overrides: {} };
  st.overrides = st.overrides || {};
  return { st, embeddedRev: embedded && embedded.rev || 0 };
}
let { st: state, embeddedRev } = loadState();
let cfgVer = 0;
const weekCache = new Map();
let cacheVer = -1;
function weekPosts(mon) {
  if (cacheVer !== cfgVer) { weekCache.clear(); cacheVer = cfgVer; }
  if (!weekCache.has(mon)) weekCache.set(mon, planWeek(state.config, mon));
  return weekCache.get(mon);
}
const chMap = () => Object.fromEntries(state.config.channels.map(c => [c.id, c]));

/* posts whose final day (after moves) falls in [a, b] */
function postsBetween(a, b) {
  const res = new Map();
  for (let n = a; n <= b; n++) res.set(n, []);
  const chs = chMap();
  for (let m = monday(a) - 14; m <= monday(b) + 14; m += 7) {
    for (const p of weekPosts(m)) {
      const o = state.overrides[p.id] || {};
      const day = o.move ? toNum(o.move) : p.day;
      if (day < a || day > b || !chs[p.ch]) continue;
      res.get(day).push({ ...p, day, orig: p.day, done: !!o.done, skip: !!o.skip, moved: !!o.move });
    }
  }
  for (const list of res.values()) list.sort((x, y) => {
    const cx = chs[x.ch], cy = chs[y.ch];
    return (cx.time || "").localeCompare(cy.time || "") || (cx.kind === cy.kind ? 0 : cx.kind === "long" ? -1 : 1) || cx.name.localeCompare(cy.name);
  });
  return res;
}
function loadOf(list) {
  const chs = chMap();
  const live = list.filter(p => !p.skip);
  const long = live.filter(p => chs[p.ch].kind === "long").length;
  return { total: live.length, long, short: live.length - long, done: live.filter(p => p.done).length };
}

/* ================= SAVING ================= */
let artifactApi = null, downloadsApi = null, saveTimer = null, saveMode = "local";
const statusEl = () => document.getElementById("status");
function setStatus(text, cls) { const el = statusEl(); if (el) { el.textContent = text; el.className = "status " + (cls || ""); } }
function commit(configChanged) {
  if (configChanged) cfgVer++;
  state.rev = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (artifactApi && saveMode !== "readonly") { setStatus("Unsaved changes…", "saving"); queuePublish(); }
  else setStatus(saveMode === "readonly" ? "View only: changes stay on this device" : "Saved on this device");
  render();
}
function queuePublish() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const a = document.activeElement;
    if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== "checkbox") { queuePublish(); return; }
    if (document.querySelector(".movebox") || editing || importOpen) { queuePublish(); return; }
    publishNow();
  }, 2500);
}
function buildDocument() {
  const css = document.getElementById("css").textContent;
  const app = document.getElementById("app").textContent;
  const json = JSON.stringify(state).replace(/</g, "\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n" +
    "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Posting Schedule</title>\n" +
    "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n" +
    "<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap\" rel=\"stylesheet\">\n" +
    "<style id=\"css\">" + css + "</style>\n</head>\n<body>\n<div id=\"root\"></div>\n" +
    "<script type=\"application/json\" id=\"saved-state\">" + json + "<\/script>\n" +
    "<script id=\"app\">" + app + "<\/script>\n</body>\n</html>\n";
}
async function publishNow() {
  if (!artifactApi) return;
  setStatus("Saving…", "saving");
  try { await artifactApi.publish(buildDocument()); setStatus("Saved"); }
  catch (e) {
    const code = e && e.code;
    if (code === "conflict") setStatus("Someone else saved first; reloaded their version", "err");
    else if (code === "not_granted" || code === "not_writer") { saveMode = "readonly"; setStatus("View only: changes stay on this device"); }
    else setStatus("Couldn't save to the page; kept on this device", "err");
  }
}

/* ================= HELPERS ================= */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmtDay(n, long) {
  const { m, d } = ymd(n);
  return long ? `${["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][wd(n)]} ${d} ${MONTHS[m]}` : `${WD[wd(n)]} ${d} ${MONTHS[m].slice(0, 3)}`;
}
function meter(ld) {
  const max = state.config.limits.maxPerDay;
  const slots = Math.max(max, ld.total);
  let h = "";
  for (let i = 0; i < slots; i++) {
    const cls = i >= max ? "over" : i < ld.long ? "l" : i < ld.total ? "s" : "";
    h += `<i class="${cls}"></i>`;
  }
  return `<span class="meter" title="${ld.total} of ${max} posts">${h}</span>`;
}
function loadPills(ld) {
  const L = state.config.limits;
  let h = `<span class="counts">${ld.long} long · ${ld.short} short</span>`;
  if (ld.total > L.maxPerDay) h += ` <span class="pill bad">${ld.total - L.maxPerDay} over the ${L.maxPerDay}/day cap</span>`;
  else if (ld.long > L.maxLongPerDay) h += ` <span class="pill bad">too many long-forms</span>`;
  if (ld.total && ld.done === ld.total) h += ` <span class="pill ok">all posted</span>`;
  return h;
}
function ruleText(c) {
  const r = c.rule;
  if (r.type === "rolling") return r.every == 1 ? "Every day" : `Every ${r.every} days from ${fmtDay(toNum(r.anchor))}`;
  if (r.type === "weekly") return (r.days || []).slice().sort().map(i => WD[i]).join(", ") || "No days picked";
  let t = `${r.perWeek} a week`;
  if (r.bonus) t += ` (+${r.bonus} if there's room)`;
  if ((r.prefer || []).length) t += `, leaning ${r.prefer.slice().sort().map(i => WD[i]).join("/")}`;
  return t;
}

const today = todayNum();
const view = { tab: "next", month: null, day: null, moving: null, exportOpen: false };
function readHash() {
  const h = (location.hash || "").slice(1);
  view.day = null;
  if (h === "channels") view.tab = "channels";
  else if (h === "results") view.tab = "results";
  else if (h === "week") view.tab = "week";

  else if (h === "month") view.tab = "month";
  else if (/^day-\d{4}-\d{2}-\d{2}$/.test(h)) { view.tab = "month"; view.day = toNum(h.slice(4)); view.month = h.slice(4, 11); }
  else view.tab = "next";
  if (!view.month) view.month = toStr(today).slice(0, 7);
}
function go(hash) { if (location.hash.slice(1) === hash) { readHash(); render(); } else location.hash = hash; }

/* ================= RENDER ================= */
function rowHtml(p, chs) {
  const c = chs[p.ch];
  const cls = ["row", c.kind, p.done ? "done" : "", p.skip ? "skip" : ""].join(" ");
  const meta = [`<span class="kind ${c.kind}">${c.kind === "long" ? "Long-form" : "Short"}</span>`, `<span class="time">${esc(c.time || "")}</span>`];
  if (p.optional) meta.push(`<span>extra, if you have time</span>`);
  if (p.moved) meta.push(`<span>moved from ${fmtDay(p.orig)}</span>`);
  if (c.id === "kids") meta.push(`<span>made for kids</span>`);
  let h = `<div class="${cls}" data-id="${esc(p.id)}" data-orig="${p.orig}" data-day="${p.day}">
    <input type="checkbox" class="check" id="chk-${esc(p.id.replace(/[^a-z0-9]/gi, "-"))}" data-act="done" ${p.done ? "checked" : ""} ${p.skip ? "disabled" : ""} aria-label="Mark ${esc(c.name)} as posted">
    <span class="bar" style="background:${esc(c.color)}"></span>
    <div><div class="name">${esc(c.name)}</div><div class="meta">${meta.join("")}</div></div>
    <div class="acts">
      ${p.done ? (state.videos || []).some(v => v.post === p.id) ? `<button class="btn small" data-act="addresult">Results ✓</button>` : `<button class="btn small" data-act="addresult">Add results</button>` : ""}
      ${p.skip ? "" : `<button class="btn small ghost" data-act="move">Move</button>`}
      <button class="btn small ghost" data-act="skip">${p.skip ? "Restore" : "Skip"}</button>
    </div>`;
  if (view.moving === p.id) {
    const from = Math.max(p.orig - 3, today - 1), to = p.orig + 7;
    const range = postsBetween(from, to);
    let opts = "";
    for (let n = from; n <= to; n++) {
      const ld = loadOf(range.get(n));
      const full = ld.total >= state.config.limits.maxPerDay || (c.kind === "long" && ld.long >= state.config.limits.maxLongPerDay);
      opts += `<button data-act="moveto" data-to="${n}" class="${full ? "full" : ""} ${n === p.day ? "cur" : ""}">${fmtDay(n)} · ${ld.total}</button>`;
    }
    h += `<div class="movebox"><span class="note">Move to (number = posts that day):</span>${opts}<button data-act="movecancel">Cancel</button></div>`;
  }

}
function dayBlock(n, list, chs, opts = {}) {
  const ld = loadOf(list);
  const isToday = n === today;
  const rows = list.length ? list.map(p => rowHtml(p, chs)).join("") : `<div class="empty">Nothing scheduled. A free day.</div>`;
  return `<section class="day ${isToday && !opts.inSheet ? "today" : ""}">
    ${opts.inSheet ? "" : `<div class="day-head"><h3>${fmtDay(n, true)}</h3>${isToday ? `<span class="pill accent">Today</span>` : n === today + 1 ? `<span class="pill">Tomorrow</span>` : ""}${meter(ld)}${loadPills(ld)}</div>`}
    ${opts.inSheet ? `<div class="day-head">${meter(ld)}${loadPills(ld)}</div>` : ""}
    ${rows}</section>`;
}

function tilesFor(a, b, label) {
  const range = postsBetween(a, b);
  const L = state.config.limits;
  let tot = 0, long = 0, done = 0, busiest = 0, over = 0, days = 0;
  for (const list of range.values()) {
    const ld = loadOf(list); days++;
    tot += ld.total; long += ld.long; done += ld.done;
    busiest = Math.max(busiest, ld.total);
    if (ld.total > L.maxPerDay || ld.long > L.maxLongPerDay) over++;
  }
  return `<div class="tiles">
    <div class="tile"><div class="k">${label}</div><div class="v">${tot}<small>posts</small></div></div>
    <div class="tile"><div class="k">Long-form / Shorts</div><div class="v">${long} / ${tot - long}</div></div>
    <div class="tile"><div class="k">Average per day</div><div class="v">${(tot / days).toFixed(1)}<small>cap ${L.maxPerDay}</small></div></div>
    <div class="tile"><div class="k">Busiest day</div><div class="v">${busiest}<small>posts</small></div></div>
    <div class="tile ${over ? "flag" : ""}"><div class="k">Days over a cap</div><div class="v">${over}</div></div>
    <div class="tile"><div class="k">Posted</div><div class="v">${done}<small>of ${tot}</small></div></div>
  </div>`;
}

function renderNext(chs) {
  const end = today + 13;
  const range = postsBetween(today, end);
  let h = tilesFor(today, end, "Next 14 days");
  h += `<div class="agenda">`;
  for (let n = today; n <= end; n++) h += dayBlock(n, range.get(n), chs);
  return h + `</div>`;
}

function renderWeek(chs) {
  const L = state.config.limits;
  const start = monday(today);
  const weeks = [start, start + 7];
  let h = "";
  for (const m of weeks) {
    const range = postsBetween(m, m + 6);
    h += `<h2 class="section-h">${m === start ? "This week" : "Next week"} · ${fmtDay(m)} to ${fmtDay(m + 6)}</h2>`;
    h += `<div class="tablewrap"><table class="week"><thead><tr><th>Channel</th>${[0,1,2,3,4,5,6].map(i => `<th>${WD[i]} ${ymd(m + i).d}</th>`).join("")}<th>Total</th></tr></thead><tbody>`;
    for (const c of state.config.channels.filter(c => c.enabled)) {
      let rowTot = 0, cells = "";
      for (let i = 0; i < 7; i++) {
        const ps = range.get(m + i).filter(p => p.ch === c.id && !p.skip);
        rowTot += ps.length;
        cells += `<td class="${ps.length ? "on" : ""}">${ps.length ? `<span class="meter"><i style="background:${esc(c.color)};border-color:${esc(c.color)}"></i></span>${ps.some(p => p.optional) ? "?" : ""}` : ""}</td>`;
      }
      h += `<tr><td>${esc(c.name)} <span class="kind ${c.kind}">${c.kind === "long" ? "L" : "S"}</span></td>${cells}<td>${rowTot}</td></tr>`;
    }
    let foot = "", grand = 0;

      const ld = loadOf(range.get(m + i)); grand += ld.total;
      foot += `<td class="${ld.total > L.maxPerDay || ld.long > L.maxLongPerDay ? "bad" : ""}">${ld.total} <span class="note">(${ld.long}L)</span></td>`;
    }
    h += `</tbody><tfoot><tr><td>Per day</td>${foot}<td>${grand}</td></tr></tfoot></table></div>`;

function renderMonth(chs) {
  const [y, mo] = view.month.split("-").map(Number);

  const lastD = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const last = first + lastD - 1;

  let h = `<div class="month-bar">

  </div>`;

    const chips = list.map(p => { const c = chs[p.ch]; return `<span class="chip ${c.kind} ${p.done ? "done" : ""} ${p.skip ? "skip" : ""} ${p.optional ? "opt" : ""}"><span class="sw" style="background:${esc(c.color)}"></span>${esc(c.name)}</span>`; }).join("");
    const dots = list.filter(p => !p.skip).map(p => { const c = chs[p.ch]; return `<i class="${c.kind} ${p.done ? "done" : ""}" style="background:${esc(c.color)}"></i>`; }).join("");
    h += `<button class="cell ${n < first || n > last ? "out" : ""} ${n === today ? "today" : ""} ${over ? "over" : ""}" data-act="nav" data-to="day-${toStr(n)}" aria-label="${fmtDay(n, true)}: ${ld.total} posts">
      <span class="top"><span class="num">${ymd(n).d}</span>${meter(ld)}</span>
      <span class="chips">${chips}</span><span class="dots">${dots}</span></button>`;

function exportRange() {

function exportPosts() {
  const [a, b] = exportRange();
  const range = postsBetween(a, b), chs = chMap(), out = [];
  for (const [n, list] of range) for (const p of list) if (!p.skip) out.push({ n, p, c: chs[p.ch] });
  return out;
}
function addMin(t, mins) { const [h, m] = (t || "12:00").split(":").map(Number); const x = h * 60 + m + mins; return [Math.floor(x / 60) % 24, x % 60]; }
function buildCsv() {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = ["Subject,Start Date,Start Time,End Date,End Time,All Day Event,Description"];
  for (const { n, p, c } of exportPosts()) {
    const { y, m, d } = ymd(n);
    const date = `${String(m + 1).padStart(2, "0")}/${String(d).padStart(2, "0")}/${y}`;
    const [h1, m1] = addMin(c.time, 0), [h2, m2] = addMin(c.time, 30);
    const tm = (h, mi) => `${(h % 12) || 12}:${String(mi).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
    const desc = `${c.kind === "long" ? "Long-form" : "Short"} upload${p.optional ? " (extra, if there's time)" : ""}${c.id === "kids" ? ". Flag as made for kids." : ""}`;
    lines.push([q(`${c.name}: ${c.kind === "long" ? "long-form" : "short"}`), date, tm(h1, m1), date, tm(h2, m2), "False", q(desc)].join(","));
  }
  return lines.join("\r\n") + "\r\n";
}
function buildIcs() {
  const e = s => String(s).replace(/\\/g, "\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Posting Schedule//EN", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Posting Schedule"];
  for (const { n, p, c } of exportPosts()) {
    const [h, m] = addMin(c.time, 0);
    const dt = toStr(n).replace(/-/g, "") + "T" + String(h).padStart(2, "0") + String(m).padStart(2, "0") + "00";
    L.push("BEGIN:VEVENT", `UID:${p.id.replace(/[^a-z0-9-]/gi, "-")}@posting-schedule`, `DTSTAMP:${stamp}`, `DTSTART:${dt}`, "DURATION:PT30M",
      `SUMMARY:${e(c.name + ": " + (c.kind === "long" ? "long-form" : "short"))}`,
      `DESCRIPTION:${e((c.kind === "long" ? "Long-form" : "Short") + " upload" + (p.optional ? " (extra, if there's time)" : ""))}`, "END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.join("\r\n") + "\r\n";
}
function exMsg(t, err) { const el = document.getElementById("ex-msg"); if (el) { el.textContent = t; el.className = "msg" + (err ? " err" : ""); } }
async function saveFile(filename, data, mime) {
  if (downloadsApi) {
    try { await downloadsApi.save({ filename, data }); exMsg("Saved " + filename + "."); }
    catch (e) { exMsg(e && e.code === "declined" ? "Download cancelled." : "This view can't save files. Use Copy instead.", e && e.code !== "declined"); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    exMsg("Downloading " + filename + ".");
  } catch (e) { exMsg("Downloads are blocked here. Use Copy instead.", true); }
}

const rview = { ch: "all", kind: "all", period: "all", sort: "score", dir: -1 };

const median = a => { const s = a.filter(x => x != null && !isNaN(x)).sort((x, y) => x - y); if (!s.length) return null; const h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
const num = x => (x === "" || x == null || isNaN(Number(x))) ? null : Number(x);
function fmtVal(k, x) {
  if (x == null) return "–";
  const f = (MDEF[k] || {}).fmt || k;
  if (f === "int") return Math.round(x).toLocaleString("en-GB");
  if (f === "pct") return x.toFixed(1) + "%";
  if (f === "dec") return x.toFixed(1);
  if (f === "money") return "$" + x.toFixed(2);
  if (f === "dur") { const s = Math.round(x); const h = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ":" + String(mm).padStart(2, "0") : mm) + ":" + String(ss).padStart(2, "0"); }

}
function compact(x) { if (x == null) return "–"; if (x >= 1e6) return (x / 1e6).toFixed(1) + "M"; if (x >= 1e4) return Math.round(x / 1e3) + "k"; if (x >= 1e3) return (x / 1e3).toFixed(1) + "k"; return String(Math.round(x)); }

  const p = s.split(":").map(Number); if (p.some(isNaN)) return null;
  return p.reduce((a, b) => a * 60 + b, 0);
}

  const m = s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);

const retOf = v => v.kind === "short" ? (v.m.stayed != null ? v.m.stayed : v.m.avp) : v.m.avp;

function enrich(videos) {
  const groups = {};
  for (const v of videos) (groups[v.ch + "|" + v.kind] = groups[v.ch + "|" + v.kind] || []).push(v);
  const base = {};
  for (const [g, list] of Object.entries(groups)) base[g] = {

  const pack = rows.filter(r => r.v.kind === "long" && r.v.m.ctr != null && r.ret != null && r.b.ctr && r.b.ret && r.b.n > 2 && r.ret >= r.b.ret && r.v.m.ctr < r.b.ctr * 0.8)
    .sort((a, b) => a.v.m.ctr / a.b.ctr - b.v.m.ctr / b.b.ctr)[0];
  if (pack) out.push(["fix", "Fix the thumbnail or title", `${link(pack)} holds viewers well (${fmtVal("avp", pack.ret)} watched) but only ${fmtVal("ctr", pack.v.m.ctr)} click, against ${fmtVal("ctr", pack.b.ctr)} usually. A new thumbnail or title could lift it.`]);
  const hook = rows.filter(r => r.v.kind === "long" && r.v.m.ctr != null && r.ret != null && r.b.ctr && r.b.ret && r.b.n > 2 && r.v.m.ctr >= r.b.ctr && r.ret < r.b.ret * 0.85)
    .sort((a, b) => a.ret / a.b.ret - b.ret / b.b.ret)[0];
  if (hook) out.push(["fix", "Fix the opening", `${link(hook)} gets clicks (${fmtVal("ctr", hook.v.m.ctr)}) but viewers leave early (${fmtVal("avp", hook.ret)} watched vs ${fmtVal("avp", hook.b.ret)} usual). Check that the first 30 seconds deliver what the title promises.`]);
  /* best weekday by median score */
  const byDay = {};
  for (const r of scored) if (r.v.published) (byDay[wd(toNum(r.v.published))] = byDay[wd(toNum(r.v.published))] || []).push(r.score);
  const days = Object.entries(byDay).filter(([, s]) => s.length >= 2).map(([d, s]) => [Number(d), median(s), s.length]).sort((a, b) => b[1] - a[1]);
  if (days.length >= 3 && days[0][1] - days[days.length - 1][1] >= 0.3) out.push(["", "Best day to post", `Videos posted on <b>${["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][days[0][0]]}</b> do best: ${days[0][1].toFixed(1)}× usual views across ${days[0][2]} videos. The weakest is ${WD[days[days.length - 1][0]]} at ${days[days.length - 1][1].toFixed(1)}×.`]);
  /* best tag */
  const byTag = {};
  for (const r of scored) for (const t of r.v.tags || []) (byTag[t] = byTag[t] || []).push(r.score);
  const tags = Object.entries(byTag).filter(([, s]) => s.length >= 2).map(([t, s]) => [t, median(s), s.length]).sort((a, b) => b[1] - a[1]);
  if (tags.length >= 2) out.push(["good", "Best topic tag", `Videos tagged <b>${esc(tags[0][0])}</b> get ${tags[0][1].toFixed(1)}× usual views (${tags[0][2]} videos). <b>${esc(tags[tags.length - 1][0])}</b> is lowest at ${tags[tags.length - 1][1].toFixed(1)}×.`]);
  /* long vs short */
  const L = all.filter(r => r.v.kind === "long"), S = all.filter(r => r.v.kind === "short");
  if (L.length >= 2 && S.length >= 2) {
    const ls = median(L.map(r => r.subsK)), ss = median(S.map(r => r.subsK));
    if (ls != null && ss != null) out.push(["", "Long-form vs Shorts", `Shorts get ${compact(median(S.map(r => r.v.m.views)))} views each and long-forms get ${compact(median(L.map(r => r.v.m.views)))}. Long-forms bring <b>${ls.toFixed(1)}</b> subscribers per 1,000 views, Shorts <b>${ss.toFixed(1)}</b>.`]);
  }
  if (!out.length) return `<p class="note">Insights appear once a channel has 3 or more videos with numbers in.</p>`;
  return `<div class="insights">${out.map(([cls, h, p]) => `<div class="ins ${cls}"><h4>${h}</h4><p>${p}</p></div>`).join("")}</div>`;
}

function scatterHtml(rows) {
  const pts = rows.filter(r => r.v.kind === "long" && r.v.m.ctr != null && r.ret != null);
  if (pts.length < 3) return `<div class="card"><h3>Clicks vs watching</h3><p class="cap">Needs 3 long-form videos with CTR and % viewed filled in.</p></div>`;
  const W = 600, H = 330, pl = 44, pr = 14, pt = 14, pb = 38;
  const xmax = Math.max(4, Math.ceil(Math.max(...pts.map(r => r.v.m.ctr)) * 1.15));
  const ymax = Math.min(100, Math.max(20, Math.ceil(Math.max(...pts.map(r => r.ret)) * 1.15 / 10) * 10));
  const X = x => pl + x / xmax * (W - pl - pr), Y = y => H - pb - y / ymax * (H - pt - pb);
  const mx = median(pts.map(r => r.v.m.ctr)), my = median(pts.map(r => r.ret));
  let g = "";
  const xs = xmax <= 10 ? 2 : xmax <= 20 ? 4 : 5;
  for (let x = 0; x <= xmax; x += xs) g += `<line class="grid" x1="${X(x)}" x2="${X(x)}" y1="${pt}" y2="${H - pb}"/><text x="${X(x)}" y="${H - pb + 15}" text-anchor="middle">${x}%</text>`;
  for (let y = 0; y <= ymax; y += ymax <= 40 ? 10 : 20) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${pl - 6}" y="${Y(y) + 4}" text-anchor="end">${y}%</text>`;
  g += `<line class="med" x1="${X(mx)}" x2="${X(mx)}" y1="${pt}" y2="${H - pb}"/><line class="med" x1="${pl}" x2="${W - pr}" y1="${Y(my)}" y2="${Y(my)}"/>`;
  g += `<text class="q" x="${W - pr - 4}" y="${pt + 12}" text-anchor="end">Winners</text>`;
  g += `<text class="q" x="${pl + 6}" y="${pt + 12}">Good video, weak thumbnail</text>`;
  g += `<text class="q" x="${W - pr - 4}" y="${H - pb - 6}" text-anchor="end">Clicks, then leaves</text>`;
  g += `<text class="q" x="${pl + 6}" y="${H - pb - 6}">Rethink</text>`;
  g += `<text x="${(pl + W - pr) / 2}" y="${H - 4}" text-anchor="middle">Click-through rate →</text>`;
  g += `<text x="12" y="${(pt + H - pb) / 2}" text-anchor="middle" transform="rotate(-90 12 ${(pt + H - pb) / 2})">% viewed →</text>`;
  const chs = chMap();
  for (const r of pts) g += `<circle class="dot" r="5.5" cx="${X(r.v.m.ctr).toFixed(1)}" cy="${Y(r.ret).toFixed(1)}" data-act="editvid" data-vid="${esc(r.v.id)}" data-tip="${esc(r.v.title)}|${esc((chs[r.v.ch] || {}).name || "")} · ${fmtVal("ctr", r.v.m.ctr)} CTR · ${fmtVal("avp", r.ret)} viewed · ${compact(r.v.m.views)} views"/>`;
  return `<div class="card" id="scatter"><h3>Clicks vs watching</h3><p class="cap">Each dot is a long-form video. Dashed lines are your medians. Hover or tap a dot.</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scatter of click-through rate against percent viewed for ${pts.length} long-form videos">${g}</svg><div class="tip" hidden></div></div>`;
}
function channelBarsHtml(rows) {
  const chs = chMap();
  const by = {};
  for (const r of rows) (by[r.v.ch] = by[r.v.ch] || []).push(r);
  const list = Object.entries(by).map(([ch, rs]) => ({ c: chs[ch] || { name: ch, color: "#888" }, n: rs.length, views: median(rs.map(r => r.v.m.views)), ctr: median(rs.map(r => r.v.m.ctr)), ret: median(rs.map(r => r.ret)) }))
    .sort((a, b) => (b.views || 0) - (a.views || 0));

}

function saveEditor(form) {
  const v = editing;
  for (const el of form.querySelectorAll("[data-vf]")) {
    const f = el.dataset.vf, val = el.value.trim();
    if (f.startsWith("m.")) {
      const k = f.slice(2);
      const x = MDEF[k].fmt === "dur" ? parseDur(val) : num(val.replace(/,/g, ""));
      if (x == null) delete v.m[k]; else v.m[k] = x;
    } else if (f === "tags") v.tags = val.split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
    else if (f === "vid") v.vid = ytId(val) || val;

  editing = null;
  commit(false);
}

/* ---------- YouTube Studio export import ---------- */
function parseCsv(text) {
  const rows = []; let row = [], f = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
const COLMAP = [
  ["vid", /^(content|video id|video)$/i], ["title", /video title|^title$/i], ["published", /publish/i], ["duration", /^duration/i],
  ["views", /^views$/i], ["impressions", /^impressions$/i], ["ctr", /click-through rate/i], ["avd", /average view duration/i],
  ["avp", /average percentage viewed/i], ["stayed", /stayed to watch|viewed \(vs\.? swiped away\)/i], ["likes", /^likes$/i],
  ["comments", /^comments( added)?$/i], ["shares", /^shares$/i], ["subs", /^subscribers( gained)?$/i], ["watchHours", /watch time \(hours\)/i],
  ["revenue", /estimated revenue/i]
];
const MON3 = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
function parseDate(s) {
  s = String(s || "").trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})/);
  if (m && MON3[m[1].toLowerCase()] != null) return `${m[3]}-${String(MON3[m[1].toLowerCase()] + 1).padStart(2, "0")}-${m[2].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2}) ([A-Za-z]{3})[a-z]*\.? (\d{4})/);
  if (m && MON3[m[2].toLowerCase()] != null) return `${m[3]}-${String(MON3[m[2].toLowerCase()] + 1).padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return "";
}
function importRows(text, ch) {
  const rows = parseCsv(text);
  if (rows.length < 2) return { error: "That file has no rows. Use “Table data.csv” from the export." };
  const head = rows[0].map(h => h.trim());
  const idx = {};
  for (const [k, re] of COLMAP) { const i = head.findIndex(h => re.test(h)); if (i >= 0) idx[k] = i; }
  if (idx.views == null || (idx.title == null && idx.vid == null)) return { error: "Couldn't find the Views and Video title columns. Use “Table data.csv” from a YouTube Studio Advanced mode export." };
  const c = chMap()[ch] || {};
  let added = 0, updated = 0;
  const asOf = toStr(today);
  if (state.videos.some(x => x.sample)) state.videos = state.videos.filter(x => !x.sample);
  for (const r of rows.slice(1)) {
    const get = k => idx[k] != null ? (r[idx[k]] || "").trim() : "";
    const vid = get("vid"), title = get("title");
    if (/^total$/i.test(vid) || /^total$/i.test(title) || (!vid && !title)) continue;
    const m = {};
    for (const k of ["views", "impressions", "ctr", "avp", "stayed", "likes", "comments", "shares", "subs", "watchHours", "revenue"]) { const x = num(get(k).replace(/[,%$\s]/g, "")); if (x != null) m[k] = x; }
    const avd = parseDur(get("avd")); if (avd != null) m.avd = avd;
    const duration = parseDur(get("duration"));
    const existing = state.videos.find(v => (vid && v.vid === vid) || (!vid && v.title === title && v.ch === ch));
    if (existing) { existing.m = Object.assign({}, existing.m, m); existing.asOf = asOf; if (title) existing.title = title; updated++; }
    else {
      const kind = duration != null ? (duration <= 180 ? "short" : "long") : (c.kind || "long");
      state.videos.push(newVideo({ id: "v" + (vid || Date.now().toString(36) + added), vid, ch, title: title || vid, published: parseDate(get("published")), kind, duration, asOf, m }));
      added++;
    }
  }
  return { added, updated };
}
let jszipPromise = null;
function loadJsZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  if (!jszipPromise) jszipPromise = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = () => res(window.JSZip); s.onerror = () => { jszipPromise = null; rej(new Error("zip")); };
    document.head.appendChild(s);
  });
  return jszipPromise;
}
async function readImportFile(file) {
  if (/\.zip$/i.test(file.name) || file.type === "application/zip") {
    const JSZip = await loadJsZip();
    const zip = await JSZip.loadAsync(file);
    const entry = Object.values(zip.files).find(f => /table data\.csv$/i.test(f.name)) || Object.values(zip.files).find(f => /\.csv$/i.test(f.name) && !/chart|totals/i.test(f.name));
    if (!entry) throw new Error("No “Table data.csv” inside that zip.");
    return entry.async("string");
  }
  return file.text();
}
function renderImport() {
  const cur = rview.ch !== "all" ? rview.ch : state.config.channels[0].id;
  return `<div class="scrim center" data-act="closeimport"><div class="modal big" role="dialog" aria-label="Import from YouTube Studio">
    <h3>Import from YouTube Studio</h3>
    <ol>
      <li>Open YouTube Studio for one channel › <b>Analytics</b> › <b>Advanced mode</b>.</li>
      <li>Keep the <b>Content</b> tab and pick a period (Lifetime works well).</li>
      <li>If they aren't showing, add the columns <b>Impressions</b>, <b>Impressions click-through rate</b>, <b>Average view duration</b>, <b>Average percentage viewed</b>, <b>Likes</b>, <b>Comments added</b> and <b>Subscribers</b> (for Shorts, also <b>Stayed to watch</b>).</li>
      <li>Click the download arrow › <b>Comma-separated values (.csv)</b>.</li>
      <li>Choose the channel below and drop in the .zip it gives you, or “Table data.csv” from inside it.</li>
    </ol>
    <label class="f" for="im-ch">Which channel is this from?<select id="im-ch">${state.config.channels.map(c => `<option value="${c.id}" ${c.id === cur ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>
    <label class="f" for="im-file">Export file (.zip or .csv)<input id="im-file" type="file" accept=".zip,.csv,text/csv,application/zip"></label>
    <label class="f" for="im-text">…or paste the CSV text<textarea id="im-text" placeholder="Content,Video title,Video publish time,Views,…"></textarea></label>
    <p>Importing again later updates the same videos with fresh numbers, and keeps your tags and notes.</p>
    <div class="row-btns"><button class="btn primary" data-act="doimport">Import</button><span class="spacer"></span><button class="btn ghost" data-act="closeimport">Close</button></div>
    <div class="msg" id="im-msg"></div>
  </div></div>`;
}
function wireScatterTips() {
  const card = document.getElementById("scatter"); if (!card) return;
  const tip = card.querySelector(".tip");
  const show = e => {
    const d = e.target.closest("circle.dot"); if (!d) { tip.hidden = true; return; }
    const [t, rest] = d.dataset.tip.split("|");
    tip.innerHTML = `<b>${esc(t)}</b><br>${esc(rest)}`; tip.hidden = false;
    const cr = card.getBoundingClientRect(), dr = d.getBoundingClientRect();
    let x = dr.left - cr.left + 10, y = dr.top - cr.top - 10;
    if (x + 240 > cr.width) x = Math.max(4, dr.left - cr.left - 250);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  };
  card.addEventListener("pointerover", show);
  card.addEventListener("pointerleave", () => { tip.hidden = true; });
}
if (!Array.isArray(state.videos)) state.videos = clone(SAMPLE_VIDEOS);

/* ================= EVENTS ================= */
function setOverride(id, patch) {
  const o = Object.assign({}, state.overrides[id] || {}, patch);
  Object.keys(o).forEach(k => { if (!o[k]) delete o[k]; });
  if (Object.keys(o).length) state.overrides[id] = o; else delete state.overrides[id];
  commit(false);
}
function findChannel(id) { return state.config.channels.find(c => c.id === id); }

document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const rowEl = t.closest(".row");
  const pid = rowEl && rowEl.dataset.id;
  if (act === "closesheet" && t.classList.contains("scrim") && ev.target !== t) return;
  if (act === "closeexport" && t.classList.contains("scrim") && ev.target !== t) return;
  if ((act === "closeedit" || act === "closeimport") && t.classList.contains("scrim") && ev.target !== t) return;
  switch (act) {
    case "nav": go(t.dataset.to); break;
    case "closesheet": go("month-" + view.month); break;
    case "dayshift": go("day-" + toStr(view.day + Number(t.dataset.to))); break;
    case "skip": {
      const cur = state.overrides[pid] || {};
      view.moving = null; setOverride(pid, { skip: !cur.skip, done: false }); break;
    }
    case "move": view.moving = view.moving === pid ? null : pid; render(); break;
    case "movecancel": view.moving = null; render(); break;
    case "moveto": {
      const n = Number(t.dataset.to);
      view.moving = null;
      setOverride(pid, { move: n === Number(rowEl.dataset.orig) ? "" : toStr(n) });
      break;
    }
    case "savenow": publishNow(); break;
    case "rsort": if (rview.sort === t.dataset.k) rview.dir = -rview.dir; else { rview.sort = t.dataset.k; rview.dir = -1; } render(); break;
    case "editvid": { const v = state.videos.find(x => x.id === t.dataset.vid); if (v) { editing = clone(v); render(); } break; }
    case "addvid": editing = newVideo(); render(); break;
    case "addresult": {
      const v = state.videos.find(x => x.post === pid);
      if (v) editing = clone(v);
      else { const ch = pid.split("|")[0]; editing = newVideo({ ch, post: pid, published: toStr(Number(rowEl.dataset.day)) }); }
      render(); break;
    }
    case "closeedit": editing = null; render(); break;
    case "delvid": {
      if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Tap again to delete"; return; }
      state.videos = state.videos.filter(x => x.id !== editing.id); editing = null; commit(false); break;
    }
    case "clearsamples": state.videos = state.videos.filter(x => !x.sample); commit(false); break;
    case "importopen": importOpen = true; render(); break;
    case "closeimport": importOpen = false; render(); break;
    case "doimport": {
      const msg = document.getElementById("im-msg");
      const say = (txt, err) => { msg.textContent = txt; msg.className = "msg" + (err ? " err" : ""); };
      const file = document.getElementById("im-file").files[0];
      const pasted = document.getElementById("im-text").value;
      const ch = document.getElementById("im-ch").value;
      let text = pasted;
      try { if (file) { say("Reading…"); text = await readImportFile(file); } }
      catch (e) { say(e.message === "zip" ? "Couldn't open the zip here. Unzip it and choose “Table data.csv” instead." : e.message || "Couldn't read that file.", true); break; }
      if (!text || !text.trim()) { say("Choose a file or paste the CSV first.", true); break; }
      const r = importRows(text, ch);
      if (r.error) { say(r.error, true); break; }
      importOpen = false; rview.ch = ch; commit(false);
      setTimeout(() => setStatus(`Imported: ${r.added} new, ${r.updated} updated`), 0);
      break;
    }
    case "export": view.exportOpen = true; render(); break;
    case "closeexport": view.exportOpen = false; render(); break;
    case "dl-csv": saveFile("posting-schedule.csv", buildCsv(), "text/csv"); break;
    case "dl-ics": saveFile("posting-schedule.ics", buildIcs(), "text/calendar"); break;
    case "copy-ics": {
      const text = buildIcs();
      const ta = document.getElementById("ex-text");
      ta.hidden = false; ta.value = text;
      try { await navigator.clipboard.writeText(text); exMsg("Copied. Paste it into a new file named schedule.ics, then open that file."); }
      catch (e) { ta.select(); exMsg("Copying is blocked here. The text is selected below: copy it by hand."); }
      break;
    }
    case "wday": {
      const c = findChannel(t.dataset.ch), f = t.dataset.field, i = Number(t.dataset.i);
      const arr = (c.rule[f] || []).slice();
      const k = arr.indexOf(i); if (k >= 0) arr.splice(k, 1); else arr.push(i);
      c.rule[f] = arr.sort(); commit(true); break;
    }
    case "reset": {
      if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Tap again to reset everything"; t.classList.add("primary"); return; }
      state.config = clone(DEFAULTS); state.overrides = {}; commit(true); break;
    }
    case "addch": {
      const id = "ch" + Date.now().toString(36);
      state.config.channels.push({ id, name: "New channel", kind: "short", color: "#888888", enabled: true, time: "12:00", link: "", start: "", custom: true,
        rule: { type: "flex", perWeek: 2, bonus: 0, prefer: [] }, note: "" });
      commit(true); break;
    }
    case "delch": state.config.channels = state.config.channels.filter(c => c.id !== t.dataset.ch); commit(true); break;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  const act = t.dataset && t.dataset.act;
  if (!act) return;
  if (act === "rfilter") { rview[t.dataset.field] = t.value; render(); return; }
  if (act === "done") { const pid = t.closest(".row").dataset.id; setOverride(pid, { done: t.checked }); return; }
  if (act === "limit") { const v = Math.max(1, Math.round(Number(t.value) || 1)); state.config.limits[t.dataset.field] = v; commit(true); return; }
  if (act === "ruletype") {
    const c = findChannel(t.dataset.ch), v = t.value;
    if (v === "rolling") c.rule = { type: "rolling", every: 2, anchor: toStr(monday(today) + 7) };
    else if (v === "weekly") c.rule = { type: "weekly", days: [0, 2, 4] };
    else c.rule = { type: "flex", perWeek: 2, bonus: 0, prefer: [] };
    commit(true); return;
  }
  if (act === "field") {
    const c = findChannel(t.dataset.ch), f = t.dataset.field;
    let v = t.type === "checkbox" ? t.checked : t.value;
    if (t.type === "number") v = Math.max(0, Math.round(Number(v) || 0));
    if (f === "rule.every") v = Math.max(1, v);
    if ((f === "rule.anchor") && !v) return;
    if (f.startsWith("rule.")) c.rule[f.slice(5)] = v; else c[f] = v;
    commit(true);
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if (editing) { editing = null; render(); }
  else if (importOpen) { importOpen = false; render(); }
  else if (view.exportOpen) { view.exportOpen = false; render(); }
  else if (view.day != null) go("month-" + view.month);
});
document.addEventListener("submit", ev => { if (ev.target.id === "vform") { ev.preventDefault(); saveEditor(ev.target); } });
window.addEventListener("hashchange", () => { view.moving = null; readHash(); render(); });

readHash();
render();
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("artifact").then(a => {
    if (!a) return;
    artifactApi = a; saveMode = "page";
    /* this device has newer changes than the page: offer them up */
    if ((state.rev || 0) > embeddedRev) {
      const el = statusEl();
      if (el) { el.className = "status saving"; el.innerHTML = 'This device has changes the page doesn\u2019t <button class="btn small" data-act="savenow">Save them</button>'; }
    } else setStatus("Saved");
  }).catch(() => {});
  window.claude.use("downloads").then(d => { if (d) downloadsApi = d; }).catch(() => {});
}
</script>
