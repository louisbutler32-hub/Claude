<title>Dining Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;600;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one screen = a dinner table seen from above. Plates are players, the menu card serves the question. */
:root {
  --wine: #2a0c16;
  --wine-2: #3d1220;
  --cloth: #c8323e;
  --cream: #fff3df;
  --cream-dim: #f1dcc0;
  --ink: #24101a;
  --gold: #ffc54d;
  --mint: #36d398;
  --bad: #ff5d62;
  --muted: #c9a9a8;
  --display: "Shrikhand", "Georgia", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(255,197,77,.18), transparent 70%),
    var(--wine);
  color: var(--cream);
  font-family: var(--body);
  font-size: 16px;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.app {
  max-width: 980px;
  margin: 0 auto;
  min-height: 100%;
  padding-block: 18px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* gingham tablecloth band */
.cloth {
  --sq: 22px;
  background-color: var(--cream);
  background-image:
    linear-gradient(90deg, rgba(200,50,62,.55) 50%, transparent 50%),
    linear-gradient(rgba(200,50,62,.55) 50%, transparent 50%);
  background-size: calc(var(--sq) * 2) calc(var(--sq) * 2);
  border-radius: 28px;
  box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 0 0 6px rgba(42,12,22,.15);
}

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 1.6rem; color: var(--gold); letter-spacing: .5px; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.top-right { display: flex; gap: 8px; align-items: center; }
.pill-btn {
  background: var(--wine-2); border: 1px solid rgba(255,243,223,.18);
  border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: .9rem;
}
.pill-btn:hover { border-color: var(--gold); }
.course-count { font-family: var(--mono); font-size: .9rem; color: var(--muted); }

/* ---------- setup ---------- */
.hero { text-align: center; padding-block: 18px 4px; }
.hero h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(3.2rem, 13vw, 6.4rem); line-height: .95; margin: 0;
  color: var(--gold);
  text-shadow: 0 6px 0 var(--cloth), 0 12px 30px rgba(0,0,0,.5);
  transform: rotate(-3deg);
  text-wrap: balance;
}
.hero p { color: var(--cream-dim); max-width: 34ch; margin: 22px auto 0; font-size: 1.1rem; line-height: 1.45; }
.setup-card { padding: 22px; }
.setup-inner {
  background: var(--cream); color: var(--ink); border-radius: 18px;
  padding: 22px; display: flex; flex-direction: column; gap: 18px;
  box-shadow: 0 6px 0 rgba(36,16,26,.18);
}
.label { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8a4a52; }
.seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.seat-row { display: flex; align-items: center; gap: 8px; background: #fff; border: 2px solid #ecd6bd; border-radius: 14px; padding: 6px 8px; min-width: 0; }
.seat-emoji { font-size: 1.6rem; background: var(--cream-dim); border: 0; border-radius: 10px; width: 44px; height: 44px; flex: none; }
.seat-row input { flex: 1; min-width: 0; border: 0; font: 600 1rem var(--body); color: var(--ink); background: transparent; padding: 8px 4px; }
.seat-row input:focus { outline: none; }
.seat-x { border: 0; background: none; color: #a87b7b; font-size: 1.2rem; width: 32px; height: 32px; border-radius: 8px; flex: none; }
.seat-x:hover { background: #f6e4d0; color: var(--cloth); }
.add-seat { border: 2px dashed #d9b99a; background: transparent; color: #8a4a52; border-radius: 14px; padding: 14px; font-weight: 700; }
.add-seat:hover { border-color: var(--cloth); color: var(--cloth); }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { border: 2px solid #ecd6bd; background: #fff; color: var(--ink); border-radius: 12px; padding: 10px 16px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--gold); border-color: var(--ink); }
.seg small { display: block; font-weight: 400; font-size: .75rem; opacity: .7; }
.big-btn {
  background: var(--cloth); color: var(--cream); border: 0; border-radius: 16px;
  padding: 16px 22px; font-family: var(--display); font-size: 1.4rem;
  box-shadow: 0 6px 0 #861e28; transition: transform .08s, box-shadow .08s;
}
.big-btn:hover { filter: brightness(1.06); }
.big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #861e28; }
.ghost-btn { background: transparent; border: 2px solid rgba(255,243,223,.35); border-radius: 14px; padding: 12px 18px; font-weight: 700; color: var(--cream); }
.ghost-btn:hover { border-color: var(--gold); color: var(--gold); }
.cats-preview { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.cats-preview span { background: var(--wine-2); border: 1px solid rgba(255,243,223,.12); border-radius: 999px; padding: 6px 12px; font-size: .9rem; color: var(--cream-dim); }

/* ---------- table ---------- */
.table { padding: 18px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.plate-seat { display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .25s; }
.plate {
  width: 100%; max-width: 168px; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #fff 0 54%, #f3ece2 55% 62%, #fff 63% 100%);
  box-shadow: 0 8px 0 rgba(36,16,26,.22), 0 14px 26px rgba(36,16,26,.35);
  display: grid; place-items: center; position: relative;
}
.plate-food { width: 58%; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 1px; font-size: clamp(1rem, 3.6vw, 1.45rem); line-height: 1.1; }
.plate-food .more { font: 700 .75rem var(--mono); color: #8a4a52; align-self: center; }
.plate-empty { font: 600 .75rem var(--body); color: #b79c94; text-align: center; }
.plate-tag {
  background: var(--ink); color: var(--cream); border-radius: 12px; padding: 6px 12px;
  display: flex; align-items: center; gap: 8px; max-width: 100%; box-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.plate-tag .nm { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.plate-tag .sc { font-family: var(--mono); color: var(--gold); font-variant-numeric: tabular-nums; }
.plate-seat.active { transform: translateY(-6px); }
.plate-seat.active .plate { box-shadow: 0 0 0 6px var(--gold), 0 14px 30px rgba(255,197,77,.45); }
.plate-seat.active .plate-tag { background: var(--gold); color: var(--ink); }
.plate-seat.active .plate-tag .sc { color: var(--ink); }
.badge { position: absolute; top: 4%; right: 4%; background: var(--ink); color: var(--gold); font-size: .72rem; font-weight: 800; border-radius: 999px; padding: 4px 8px; box-shadow: 0 2px 0 rgba(0,0,0,.3); }

.turn-head { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.turn-head h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 6vw, 2.5rem); margin: 0; text-wrap: balance; }
.turn-head p { margin: 0; color: var(--cream-dim); }
.notice {
  border-radius: 14px; padding: 12px 16px; font-weight: 600; text-align: center;
  background: rgba(255,197,77,.12); border: 1px solid rgba(255,197,77,.45); color: var(--gold);
}
.notice.special { background: rgba(54,211,152,.12); border-color: rgba(54,211,152,.5); color: var(--mint); }
.menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.menu-item {
  background: var(--cream); color: var(--ink); border: 0; border-radius: 18px; padding: 18px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  box-shadow: 0 6px 0 #cfae8c; transition: transform .1s, box-shadow .1s;
}
.menu-item:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #cfae8c; }
.menu-item:active { transform: translateY(3px); box-shadow: 0 3px 0 #cfae8c; }
.menu-item .dish { font-size: 2.6rem; }
.menu-item .cn { font-family: var(--display); font-size: 1.25rem; }
.menu-item .ct { font-size: .85rem; color: #7b5a5a; }

/* ---------- question ---------- */
.q-card { padding: 18px; }
.q-inner { background: var(--cream); color: var(--ink); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.q-meta { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.chip { background: var(--ink); color: var(--gold); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: .85rem; }
.chip.fork { background: var(--gold); color: var(--ink); }
.timer-wrap { height: 12px; background: #ecd6bd; border-radius: 999px; overflow: hidden; }
.timer { height: 100%; width: 100%; background: var(--mint); border-radius: 999px; transform-origin: left; }
.timer.low { background: var(--bad); }
.q-text { font-size: clamp(1.3rem, 4.5vw, 1.9rem); font-weight: 800; line-height: 1.25; margin: 0; text-wrap: balance; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ans {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: #fff; border: 3px solid #ecd6bd; border-radius: 14px; padding: 14px; color: var(--ink);
  font-weight: 700; font-size: 1.05rem; min-width: 0; transition: transform .08s, border-color .1s, background .15s;
}
.ans:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-2px); }
.ans .k { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--ink); color: var(--gold); font-family: var(--mono); font-size: .85rem; }
.ans span:last-child { min-width: 0; overflow-wrap: anywhere; }
.ans:disabled { cursor: default; }
.ans.right { background: var(--mint); border-color: #1f9e6f; }
.ans.wrong { background: var(--bad); border-color: #b8353a; color: #fff; }
.ans.fade { opacity: .45; }
.result { border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
.result.ok { background: rgba(54,211,152,.14); border: 2px solid var(--mint); }
.result.no { background: rgba(255,93,98,.12); border: 2px solid var(--bad); }
.result h3 { font-family: var(--display); font-weight: 400; font-size: 1.8rem; margin: 0; }
.result p { margin: 0; color: var(--cream-dim); }
.result .pts { font-family: var(--mono); font-size: 1.3rem; color: var(--gold); }

/* ---------- end ---------- */
.end-hero { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; padding-top: 10px; }
.end-hero .crown { font-size: 3.4rem; }
.end-hero h2 { font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 9vw, 3.8rem); margin: 0; color: var(--gold); text-wrap: balance; }
.end-hero p { margin: 0; color: var(--cream-dim); }
.bill { background: var(--cream); color: var(--ink); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 4px; font-family: var(--mono); max-width: 520px; width: 100%; margin: 0 auto; box-shadow: 0 8px 0 #cfae8c; }
.bill h3 { font-family: var(--display); font-weight: 400; text-align: center; margin: 0 0 8px; font-size: 1.4rem; }
.bill-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 2px dotted #d9b99a; }
.bill-row:last-child { border-bottom: 0; }
.bill-row .rk { width: 2ch; color: #8a4a52; }
.bill-row .who { flex: 1; min-width: 0; font-family: var(--body); font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bill-row .dishes { color: #8a4a52; font-size: .85rem; }
.bill-row .tot { font-variant-numeric: tabular-nums; font-weight: 700; }
.end-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }

.fly { position: fixed; z-index: 30; font: 700 1.6rem var(--mono); color: var(--gold); pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,.4); animation: fly 1.1s ease-out forwards; }
@keyframes fly { from { opacity: 1; transform: translate(-50%, 0) scale(1); } to { opacity: 0; transform: translate(-50%, -80px) scale(1.3); } }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ---------- mode picker ---------- */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modes button { text-align: left; background: #fff; border: 2px solid #ecd6bd; border-radius: 14px; padding: 14px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.modes button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--cream); }
.modes .mt { font-family: var(--display); font-size: 1.3rem; }
.modes button[aria-pressed="true"] .mt { color: var(--gold); }
.modes .md { font-size: .88rem; line-height: 1.35; opacity: .85; }

/* ---------- last bite ---------- */
.bseats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.bseat { background: var(--wine-2); border: 2px solid rgba(255,243,223,.14); border-radius: 14px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; min-width: 0; transition: transform .2s; }
.bseat .nm { font-weight: 800; max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bseat .hp { letter-spacing: 1px; font-size: .85rem; }
.bseat .sc { font-family: var(--mono); color: var(--gold); font-variant-numeric: tabular-nums; }
.bseat.active { border-color: var(--gold); background: var(--gold); color: var(--ink); transform: translateY(-3px); }
.bseat.active .sc { color: var(--ink); }
.bseat.out { opacity: .45; text-decoration: line-through; }
.bite-card { padding: 18px; }
.bite-inner { background: var(--cream); color: var(--ink); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.bite-prompt { font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 6vw, 2.6rem); line-height: 1.1; margin: 0; text-wrap: balance; text-align: center; }
.bite-who { text-align: center; font-weight: 800; font-size: 1.1rem; }
.bite-who b { color: var(--cloth); }
.bite-form { display: flex; gap: 8px; }
.bite-form input { flex: 1; min-width: 0; font: 700 1.2rem var(--body); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 14px 16px; }
.bite-form input:focus { outline: none; border-color: var(--cloth); box-shadow: 0 0 0 4px rgba(200,50,62,.2); }
.bite-form input:disabled { opacity: .5; }
.bite-form .big-btn { font-size: 1.15rem; padding: 12px 18px; }
.flash { min-height: 1.5em; text-align: center; font-weight: 800; }
.flash.good { color: #16855c; }
.flash.warn { color: var(--cloth); }
.tiers, .served, .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.served { max-height: 160px; overflow: auto; }
.srv { border-radius: 999px; padding: 5px 10px; font-weight: 700; font-size: .88rem; display: inline-flex; gap: 6px; align-items: center; border: 2px solid transparent; }
.srv small { font-family: var(--mono); font-size: .72rem; opacity: .8; }
.t0 { background: #efe2cf; color: var(--ink); }
.t1 { background: #ffe09a; color: var(--ink); }
.t2 { background: #ffab7a; color: var(--ink); }
.t3 { background: var(--ink); color: var(--gold); border-color: var(--gold); }
.served-label { text-align: center; font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8a4a52; }
.result .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

@media (max-width: 640px) {
  .modes { grid-template-columns: 1fr; }
  .bite-card { padding: 10px; }
  .bite-inner { padding: 16px; }
  .bite-form .big-btn { padding: 10px 14px; }
  .menu { grid-template-columns: 1fr; }
  .menu-item { flex-direction: row; justify-content: flex-start; text-align: left; padding: 14px 16px; gap: 14px; }
  .menu-item .dish { font-size: 2rem; }
  .menu-item .txt { display: flex; flex-direction: column; }
  .answers { grid-template-columns: 1fr; }
  .table { grid-template-columns: repeat(2, 1fr); padding: 14px; }
  .cloth { --sq: 16px; border-radius: 20px; }
  .q-card, .setup-card { padding: 10px; }
  .q-inner, .setup-inner { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app">
  <!-- SETUP -->
  <section id="scr-setup">
    <div class="hero">
      <h1>Dining Room</h1>
      <p>The trivia party for your group chat. Music, sport, games, memes and celebs. No spelling tests, ever.</p>
    </div>
    <div style="height:18px"></div>
    <div class="cloth setup-card">
      <div class="setup-inner">
        <div class="label">Pick a game</div>
        <div class="modes" id="mode-seg">
          <button data-mode="quiz" aria-pressed="true"><span class="mt">Quiz Night</span><span class="md">Pick a course from the menu and answer multiple choice against the clock.</span></button>
          <button data-mode="bite" aria-pressed="false"><span class="mt">Last Bite</span><span class="md">Name something in the category. Rarer answers score more. Blank and you lose a heart.</span></button>
        </div>
        <div class="label">Who's at the table? (1 to 4 players)</div>
        <div class="seats" id="seats"></div>
        <div id="quiz-opts" style="display:flex;flex-direction:column;gap:18px">
          <div class="label">Courses each</div>
          <div class="seg" id="len-seg">
            <button data-n="5" aria-pressed="false">5<small>quick bite</small></button>
            <button data-n="8" aria-pressed="true">8<small>dinner</small></button>
            <button data-n="12" aria-pressed="false">12<small>all-you-can-eat</small></button>
          </div>
        </div>
        <div id="bite-opts" hidden>
          <div style="display:flex;flex-direction:column;gap:18px">
            <div class="label">Hearts each</div>
            <div class="seg" id="hearts-seg">
              <button data-h="2" aria-pressed="false">2<small>brutal</small></button>
              <button data-h="3" aria-pressed="true">3<small>standard</small></button>
              <button data-h="5" aria-pressed="false">5<small>long dinner</small></button>
            </div>
          </div>
        </div>
        <button class="big-btn" id="start-btn">Take your seats</button>
      </div>
    </div>
    <div style="height:16px"></div>
    <div class="cats-preview" id="cats-preview"></div>
  </section>

  <!-- TABLE / MENU -->
  <section id="scr-table" hidden>
    <div class="top">
      <div class="brand">Dining Room</div>
      <div class="top-right">
        <span class="course-count" id="course-count"></span>
        <button class="pill-btn" id="mute-btn" aria-label="Toggle sound">🔊</button>
        <button class="pill-btn" id="quit-btn">Leave</button>
      </div>
    </div>
    <div style="height:16px"></div>
    <div class="cloth table" id="table"></div>
    <div style="height:22px"></div>
    <div class="turn-head">
      <h2 id="turn-title"></h2>
      <p id="turn-sub">Pick a course from the menu</p>
    </div>
    <div style="height:14px"></div>
    <div id="notices" style="display:flex;flex-direction:column;gap:8px"></div>
    <div style="height:14px"></div>
    <div class="menu" id="menu"></div>
  </section>

  <!-- QUESTION -->
  <section id="scr-q" hidden>
    <div class="top">
      <div class="brand">Dining Room</div>
      <span class="course-count" id="q-count"></span>
    </div>
    <div style="height:16px"></div>
    <div class="cloth q-card">
      <div class="q-inner" id="q-inner">
        <div class="q-meta">
          <span class="chip" id="q-cat"></span>
          <span style="font-weight:800" id="q-who"></span>
        </div>
        <div class="timer-wrap"><div class="timer" id="timer"></div></div>
        <p class="q-text" id="q-text"></p>
        <div class="answers" id="answers"></div>
      </div>
    </div>
    <div style="height:16px"></div>
    <div id="result-slot"></div>
  </section>

  <!-- LAST BITE -->
  <section id="scr-bite" hidden>
    <div class="top">
      <div class="brand">Dining Room</div>
      <div class="top-right">
        <span class="course-count" id="bite-count"></span>
        <button class="pill-btn" id="bite-mute" aria-label="Toggle sound">🔊</button>
        <button class="pill-btn" id="bite-quit">Leave</button>
      </div>
    </div>
    <div style="height:14px"></div>
    <div class="bseats" id="bseats"></div>
    <div style="height:14px"></div>

/* ---------------- helpers ---------------- */
const $ = (id) => document.getElementById(id);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const EMOJIS = ["😎", "🤠", "👽", "🦊", "🐸", "🤖", "👻", "🐼", "🦄", "💀", "🧃", "🍉"];
const QUESTION_TIME = 15;

/* ---------------- sound ---------------- */
let actx = null;
let muted = store.get("dr-muted") === "1";
function tone(freq, dur = 0.12, type = "sine", vol = 0.12, delay = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  pick() { tone(520, 0.08, "triangle"); tone(780, 0.1, "triangle", 0.1, 0.06); },
  right() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.14, "triangle", 0.12, i * 0.07)); },
  wrong() { tone(180, 0.25, "sawtooth", 0.08); tone(140, 0.3, "sawtooth", 0.08, 0.12); },
  tick() { tone(1200, 0.04, "square", 0.04); },
  steal() { [880, 660, 990, 1320].forEach((f, i) => tone(f, 0.12, "square", 0.06, i * 0.06)); },
  win() { [523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, "triangle", 0.12, i * 0.12)); },
};

/* ---------------- state ---------------- */
let seats = [ { name: "Player 1", emoji: "😎" }, { name: "Player 2", emoji: "🦊" } ];
let coursesEach = 8;
let G = null; // game state
const decks = {};

function drawQuestion(catId) {
  if (!decks[catId] || decks[catId].length === 0) decks[catId] = shuffle(Q[catId]);
  return decks[catId].pop();
}

/* ---------------- screens ---------------- */
function show(id) {
  ["scr-setup", "scr-table", "scr-q", "scr-bite", "scr-end"].forEach((s) => { $(s).hidden = s !== id; });
  window.scrollTo(0, 0);
}

/* ---------------- setup ---------------- */
function renderSeats() {
  const box = $("seats");
  box.innerHTML = "";
  seats.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "seat-row";
    row.innerHTML = `
      <button class="seat-emoji" title="Change avatar" aria-label="Change avatar for seat ${i + 1}">${s.emoji}</button>
      <input id="seat-name-${i}" maxlength="14" value="${esc(s.name)}" aria-label="Name for seat ${i + 1}">
      ${seats.length > 1 ? `<button class="seat-x" aria-label="Remove seat ${i + 1}">✕</button>` : ""}`;
    row.querySelector(".seat-emoji").onclick = () => {
      s.emoji = EMOJIS[(EMOJIS.indexOf(s.emoji) + 1) % EMOJIS.length]; sfx.pick(); renderSeats();
    };
    row.querySelector("input").oninput = (e) => { s.name = e.target.value; };
    const x = row.querySelector(".seat-x");
    if (x) x.onclick = () => { seats.splice(i, 1); renderSeats(); };
    box.appendChild(row);
  });
  if (seats.length < 4) {
    const add = document.createElement("button");
    add.className = "add-seat";
    add.textContent = "+ Pull up a chair";
    add.onclick = () => {
      const used = seats.map((s) => s.emoji);
      seats.push({ name: `Player ${seats.length + 1}`, emoji: EMOJIS.find((e) => !used.includes(e)) });
      renderSeats();
    };
    box.appendChild(add);
  }
}
$("len-seg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  coursesEach = +b.dataset.n;
  [...$("len-seg").children].forEach((c) => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
});
$("cats-preview").innerHTML = CATS.map((c) => `<span>${c.dish} ${c.name}</span>`).join("");

function startGame() {
  G = {
    players: seats.map((s, i) => ({ name: (s.name || "").trim() || `Player ${i + 1}`, emoji: s.emoji, score: 0, dishes: [], streak: 0, special: false, right: 0 })),
    turn: 0,
    total: seats.length * coursesEach,
  };
  sfx.pick();
  nextTurn();
}
$("start-btn").onclick = startGame;

/* ---------------- table ---------------- */
const cur = () => G.players[G.turn % G.players.length];

function renderTable(activeIdx) {
  $("table").innerHTML = G.players.map((p, i) => {
    const shown = p.dishes.slice(-8);
    const more = p.dishes.length - shown.length;
    const food = p.dishes.length
      ? `<div class="plate-food">${shown.join("")}${more > 0 ? `<span class="more">+${more}</span>` : ""}</div>`
      : `<div class="plate-empty">empty<br>plate</div>`;
    const badge = p.special ? `<span class="badge">2× NEXT</span>` : (p.streak >= 2 ? `<span class="badge">🔥${p.streak}</span>` : "");
    return `<div class="plate-seat ${i === activeIdx ? "active" : ""}">
      <div class="plate">${food}${badge}</div>
      <div class="plate-tag"><span>${p.emoji}</span><span class="nm">${esc(p.name)}</span><span class="sc">${p.score}</span></div>
    </div>`;
  }).join("");
}

function nextTurn() {
  if (G.turn >= G.total) return endGame();
  const p = cur();
  const n = G.players.length;
  const course = Math.floor(G.turn / n) + 1;
  G.fork = n > 1 && G.turn >= n && Math.random() < 0.22 && G.players.some((q) => q !== p && q.score > 0);
  $("course-count").textContent = `Course ${course} of ${coursesEach}`;
  renderTable(G.turn % n);
  $("turn-title").textContent = n > 1 ? `${p.emoji} ${p.name}, you're up` : `${p.emoji} Course ${course}`;
  $("turn-sub").textContent = "Pick a course from the menu";

  const notes = [];
  if (G.fork) notes.push(`<div class="notice">🍴 Golden Fork. Get this one right and you steal up to 150 points and a dish from the leader.</div>`);
  if (p.special) notes.push(`<div class="notice special">👨‍🍳 Chef's Special. Your next right answer pays double.</div>`);
  $("notices").innerHTML = notes.join("");

  const options = shuffle(CATS).slice(0, 3);
  $("menu").innerHTML = "";
  options.forEach((c) => {
    const b = document.createElement("button");
    b.className = "menu-item pop";
    b.innerHTML = `<span class="dish">${c.dish}</span><span class="txt"><span class="cn">${c.name}</span><span class="ct">${c.tag}</span></span>`;
    b.onclick = () => { sfx.pick(); askQuestion(c); };
    $("menu").appendChild(b);
  });
  show("scr-table");
}

/* ---------------- question ---------------- */
let timerRaf = null, qStart = 0, answered = false, lastTick = 0, currentQ = null;

function askQuestion(cat) {
  const [text, correct, ...wrongs] = drawQuestion(cat.id);
  const p = cur();
  currentQ = { cat, text, correct, opts: shuffle([correct, ...wrongs]) };
  answered = false;
  $("q-count").textContent = $("course-count").textContent;
  $("q-cat").textContent = `${cat.dish} ${cat.name}`;
  $("q-cat").className = "chip" + (G.fork ? " fork" : "");
  if (G.fork) $("q-cat").textContent += " · Golden Fork";
  $("q-who").textContent = `${p.emoji} ${p.name}`;
  $("q-text").textContent = text;
  $("result-slot").innerHTML = "";
  const box = $("answers");
  box.innerHTML = "";
  currentQ.opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "ans";
    b.innerHTML = `<span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span>`;
    b.onclick = () => answer(i);
    box.appendChild(b);
  });
  show("scr-q");
  $("q-inner").classList.remove("pop"); void $("q-inner").offsetWidth; $("q-inner").classList.add("pop");
  qStart = performance.now(); lastTick = QUESTION_TIME;
  cancelAnimationFrame(timerRaf);
  const bar = $("timer");
  const step = (now) => {
    const left = Math.max(0, QUESTION_TIME - (now - qStart) / 1000);
    bar.style.transform = `scaleX(${left / QUESTION_TIME})`;
    bar.classList.toggle("low", left < 5);
    if (left < 5 && Math.ceil(left) < lastTick) { lastTick = Math.ceil(left); sfx.tick(); }
    if (left <= 0) return answer(-1);
    timerRaf = requestAnimationFrame(step);
  };
  timerRaf = requestAnimationFrame(step);
}

function answer(i) {
  if (answered) return;
  answered = true;
  cancelAnimationFrame(timerRaf);
  const left = Math.max(0, QUESTION_TIME - (performance.now() - qStart) / 1000);
  const p = cur();
  const btns = [...$("answers").children];
  const ci = currentQ.opts.indexOf(currentQ.correct);
  btns.forEach((b, k) => {
    b.disabled = true;
    if (k === ci) b.classList.add("right");
    else if (k === i) b.classList.add("wrong");
    else b.classList.add("fade");
  });
  const ok = i === ci;
  let lines = [];
  let pts = 0;
  if (ok) {
    pts = 100 + Math.round(100 * left / QUESTION_TIME);
    if (p.special) { pts *= 2; p.special = false; lines.push("Chef's Special cashed in. Double points."); }
    p.score += pts; p.right++;
    p.dishes.push(currentQ.cat.dish);
    p.streak++;
    if (p.streak > 0 && p.streak % 3 === 0) { p.special = true; lines.push(`Three in a row. Your next right answer pays double.`); }
    if (G.fork) {
      const rivals = G.players.filter((q) => q !== p);
      const leader = rivals.reduce((a, b) => (b.score > a.score ? b : a), rivals[0]);
      if (leader && leader.score > 0) {
        const take = Math.min(150, leader.score);
        leader.score -= take; p.score += take;
        const dish = leader.dishes.pop();
        if (dish) p.dishes.push(dish);
        lines.push(`🍴 You stole ${take} points${dish ? " and a " + dish : ""} from ${leader.name}.`);
        setTimeout(sfx.steal, 350);
      }
    }
    sfx.right();
    flyPoints(btns[ci], `+${pts}`);
  } else {
    p.streak = 0;
    if (p.special) { p.special = false; lines.push("Chef's Special lost."); }
    sfx.wrong();
    $("q-inner").classList.add("shake");
    setTimeout(() => $("q-inner").classList.remove("shake"), 400);
  }

  G.turn++;
  const last = G.turn >= G.total;
  const n = G.players.length;
  const nextP = G.players[G.turn % n];
  const btnLabel = last ? "Bring the bill" : (n > 1 ? `Pass the plate to ${nextP.emoji} ${nextP.name}` : "Next course");
  const head = ok
    ? (left > 11 ? "Lightning!" : left > 6 ? "Delicious." : "Just in time.")
    : (i === -1 ? "Time's up!" : "Sent back to the kitchen.");
  const sub = ok ? "" : `The answer was <strong>${esc(currentQ.correct)}</strong>.`;
  $("result-slot").innerHTML = `
    <div class="result ${ok ? "ok" : "no"} pop">
      <h3>${head}</h3>
      ${ok ? `<div class="pts">+${pts} · ${currentQ.cat.dish} added to your plate</div>` : ""}
      ${sub ? `<p>${sub}</p>` : ""}
      ${lines.map((l) => `<p>${esc(l)}</p>`).join("")}
      <button class="big-btn" id="next-btn">${esc(btnLabel)}</button>
    </div>`;
  const nb = $("next-btn");
  nb.onclick = () => { sfx.pick(); nextTurn(); };
  nb.focus({ preventScroll: true });
  $("result-slot").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function flyPoints(el, txt) {
  const r = el.getBoundingClientRect();
  const f = document.createElement("div");
  f.className = "fly"; f.textContent = txt;
  f.style.left = r.left + r.width / 2 + "px"; f.style.top = r.top + "px";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1200);
}

/* ---------------- end ---------------- */
function endGame() {
  const ranked = G.players.slice().sort((a, b) => b.score - a.score);
  const n = G.players.length;
  if (n === 1) {
    const p = ranked[0];
    const best = Math.max(+store.get("dr-best") || 0, p.score);
    store.set("dr-best", String(best));
    $("end-kicker").textContent = "Dinner's done";
    $("end-title").textContent = `${p.score} points`;
    $("end-sub").textContent = `${p.right} of ${G.total} right · your best is ${best}`;
  } else {
    const top = ranked.filter((p) => p.score === ranked[0].score);
    $("end-kicker").textContent = top.length > 1 ? "It's a tie for chef of the night" : "Chef of the night";
    $("end-title").textContent = top.map((p) => `${p.emoji} ${p.name}`).join(" & ");
    $("end-sub").textContent = `${ranked[0].score} points and ${ranked[0].dishes.length} dishes cleared`;
  }
  $("bill").innerHTML = `<h3>The Bill</h3>` + ranked.map((p, i) => `
    <div class="bill-row">
      <span class="rk">${i + 1}</span>
      <span class="who">${p.emoji} ${esc(p.name)}</span>
      <span class="dishes">${p.right}/${coursesEach} right</span>
      <span class="tot">${p.score}</span>
    </div>`).join("");
  show("scr-end");
  sfx.win();
  confetti();
}
$("again-btn").onclick = startGame;
$("new-btn").onclick = () => { show("scr-setup"); renderSeats(); };
$("quit-btn").onclick = () => { cancelAnimationFrame(timerRaf); show("scr-setup"); renderSeats(); };

/* ---------------- confetti ---------------- */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), cx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const items = ["🍕", "🍿", "🌭", "🍔", "🍩", "🍰", "🎉"];
  const parts = Array.from({ length: 70 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.6,
    vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: Math.random() * 6, vr: -0.05 + Math.random() * 0.1,
    e: items[Math.floor(Math.random() * items.length)], s: 18 + Math.random() * 16,
  }));
  const t0 = performance.now();
  (function frame(now) {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach((p) => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.font = `${p.s}px serif`; cx.fillText(p.e, 0, 0); cx.restore();
    });
    if (now - t0 < 4500) requestAnimationFrame(frame); else cx.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}

/* ---------------- keys + mute ---------------- */
document.addEventListener("keydown", (e) => {
  if (!$("scr-q").hidden && !answered) {
    const k = e.key.toLowerCase();
    const idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
    if (idx >= 0 && document.activeElement.tagName !== "INPUT") { e.preventDefault(); answer(idx); }
  }
  if (!$("scr-table").hidden && "123".includes(e.key)) {
    const b = $("menu").children[+e.key - 1]; if (b) b.click();
  }
});
function paintMute() { $("mute-btn").textContent = muted ? "🔇" : "🔊"; }
$("mute-btn").onclick = () => { muted = !muted; store.set("dr-muted", muted ? "1" : "0"); paintMute(); };
paintMute();
renderSeats();
</script>

/* ---------- matching ---------- */
function norm(s) {
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/&/g, "and").replace(/\$/g, "s").replace(/^\s*the\s+/, "").replace(/[^a-z0-9]/g, "");
}
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  // edit distance where swapping two neighbouring letters (Hermoine) counts as one typo
  let pp = null, prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (pp && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, pp[j - 2] + 1);
      cur[j] = v;
      if (v < rowMin) rowMin = v;
    }
    if (rowMin > max) return max + 1;
    pp = prev;
    prev = cur;
  }
  return prev[b.length];
}
function buildPrompt(def) {
  const entries = [], map = new Map();
  def.t.forEach((str, tier) => str.split(";").forEach((raw) => {
    const names = raw.split("|").map((s) => s.trim()).filter(Boolean);
    if (!names.length) return;
    const e = { display: names[0], tier, keys: [], by: null };
    names.forEach((n) => { const k = norm(n); if (k && !map.has(k)) { map.set(k, e); e.keys.push(k); } });
    if (e.keys.length) entries.push(e);
  }));
  return { text: def.p, icon: def.c, entries, map, served: [], turns: 0 };
}
function matchAnswer(pr, input) {
  const k = norm(input);
  if (!k) return null;
  if (pr.map.has(k)) return pr.map.get(k);
  if (k.length < 5 || /\d/.test(k)) return null; // no typo help on short or numbered answers (Toy Story 2 vs 3)
  const max = k.length >= 9 ? 2 : 1;
  let best = null, bestD = max + 1;
  for (const [key, e] of pr.map) {
    if (/\d/.test(key)) continue;
    const d = lev(k, key, max);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

/* ---------- state ---------- */
let mode = "quiz", heartsEach = 3, lastMode = "quiz";
let B = null, biteRaf = null, biteLocked = false, biteStart = 0;

function aliveList() { return B.players.filter((p) => p.alive); }
function nextAlive(i) {
  const n = B.players.length;
  for (let s = 1; s <= n; s++) { const j = (i + s) % n; if (B.players[j].alive) return j; }
  return i;
}
function lapSize() { const a = aliveList().length; return a === 1 ? 3 : a; }
function turnTime() { const lap = Math.floor(B.prompt.turns / lapSize()); return Math.max(7, 15 - lap * 2); }
function biteOver() { return B.players.length === 1 ? aliveList().length === 0 : aliveList().length <= 1; }

function startBite() {
  lastMode = "bite";
  B = {
    players: seats.map((s, i) => ({ name: (s.name || "").trim() || `Player ${i + 1}`, emoji: s.emoji, score: 0, hearts: heartsEach, alive: true, served: 0, outAt: 0 })),
    order: shuffle(PROMPTS.map((_, i) => i)), promptIdx: -1, cur: 0, outCount: 0, prompt: null,
  };
  sfx.pick();
  newPrompt(0);
}
function newPrompt(starter) {
  B.promptIdx = (B.promptIdx + 1) % B.order.length;
  if (B.promptIdx === 0 && B.prompt) B.order = shuffle(B.order);
  B.prompt = buildPrompt(PROMPTS[B.order[B.promptIdx]]);
  B.cur = starter;
  $("bite-result").innerHTML = "";
  show("scr-bite");
  $("bite-inner").classList.remove("pop"); void $("bite-inner").offsetWidth; $("bite-inner").classList.add("pop");
  startBiteTurn();
}

function renderBite() {
  const pr = B.prompt;
  $("bseats").innerHTML = B.players.map((p, i) => `
    <div class="bseat ${i === B.cur && p.alive ? "active" : ""} ${p.alive ? "" : "out"}">
      <span>${p.emoji}</span><span class="nm">${esc(p.name)}</span>
      <span class="hp">${p.alive ? "❤️".repeat(p.hearts) : "💀"}</span><span class="sc">${p.score}</span>
    </div>`).join("");
  $("bite-prompt").textContent = `${pr.icon} ${pr.text}`;
  $("bite-tiers").innerHTML = TIERS.map((t, i) => `<span class="srv t${i}">${t.name} <small>${t.pts}</small></span>`).join("");
  $("bite-count").textContent = `${pr.served.length} served`;
  $("served-label").textContent = pr.served.length ? "Already served, so off the menu" : "Nothing served yet";
  $("served").innerHTML = pr.served.map((s) => `<span class="srv t${s.tier}">${esc(s.display)} <small>${B.players[s.by].emoji}</small></span>`).join("");
}

function startBiteTurn() {
  biteLocked = false;
  const p = B.players[B.cur];
  B.turnTime = turnTime();
  renderBite();
  $("bite-who").innerHTML = B.players.length > 1
    ? `<b>${p.emoji} ${esc(p.name)}</b>, you're up · ${B.turnTime}s`
    : `${p.emoji} Your turn · ${B.turnTime}s`;
  const inp = $("bite-input");
  inp.disabled = false; inp.value = "";
  inp.focus({ preventScroll: true });
  setFlash("", "");
  biteStart = performance.now();
  let lastT = B.turnTime;
  cancelAnimationFrame(biteRaf);
  const bar = $("bite-timer");
  const step = (now) => {
    const left = Math.max(0, B.turnTime - (now - biteStart) / 1000);
    bar.style.transform = `scaleX(${left / B.turnTime})`;
    bar.classList.toggle("low", left < 4);
    if (left < 4 && Math.ceil(left) < lastT) { lastT = Math.ceil(left); sfx.tick(); }
    if (left <= 0) return biteFail("time", "");
    biteRaf = requestAnimationFrame(step);
  };
  biteRaf = requestAnimationFrame(step);
}
function setFlash(text, cls) { const f = $("bite-flash"); f.textContent = text; f.className = "flash " + cls; }

function submitBite() {
  if (biteLocked || !B) return;
  const inp = $("bite-input");
  const val = inp.value.trim();
  if (!val) return;
  const pr = B.prompt;
  const e = matchAnswer(pr, val);
  if (e && e.by !== null) {
    const who = B.players[e.by];
    setFlash(`${e.display} was already served by ${who.emoji} ${who.name}. Think fast!`, "warn");
    tone(220, 0.12, "square", 0.06);
    inp.value = "";
    $("bite-inner").classList.add("shake"); setTimeout(() => $("bite-inner").classList.remove("shake"), 400);
    return;
  }
  if (!e) return biteFail("menu", val);
  const p = B.players[B.cur];
  const t = TIERS[e.tier];
  e.by = B.cur;
  p.score += t.pts; p.served++;
  pr.served.unshift({ display: e.display, tier: e.tier, by: B.cur });
  pr.turns++;
  biteLocked = true;
  cancelAnimationFrame(biteRaf);
  inp.disabled = true;
  if (e.tier === 3) sfx.steal(); else sfx.right();
  flyPoints(inp, `+${t.pts}`);
  renderBite();
  setFlash(`${e.display} · ${t.name} · +${t.pts}`, "good");
  setTimeout(() => {
    const allGone = pr.entries.every((x) => x.by !== null);
    if (allGone || pr.turns >= lapSize() * 3) return tableCleared(allGone);
    B.cur = nextAlive(B.cur);
    startBiteTurn();
  }, 850);
}

function missedChips(n) {
  const left = shuffle(B.prompt.entries.filter((e) => e.by === null)).sort((a, b) => b.tier - a.tier).slice(0, n);
  if (!left.length) return "";
  return `<p>Nobody said:</p><div class="missed">${left.map((e) => `<span class="srv t${e.tier}">${esc(e.display)} <small>${TIERS[e.tier].pts}</small></span>`).join("")}</div>`;
}

function biteFail(reason, guess) {
  if (biteLocked) return;
  biteLocked = true;
  cancelAnimationFrame(biteRaf);
  $("bite-input").disabled = true;
  const p = B.players[B.cur];
  p.hearts--;
  let out = false;
  if (p.hearts <= 0) { p.alive = false; p.outAt = ++B.outCount; out = true; }
  sfx.wrong();
  $("bite-inner").classList.add("shake"); setTimeout(() => $("bite-inner").classList.remove("shake"), 400);
  renderBite();
  const over = biteOver();
  const nextIdx = nextAlive(B.cur);
  const head = out ? `💀 ${esc(p.name)} is out` : `💔 ${esc(p.name)} loses a heart`;
  const why = reason === "time" ? "Out of time." : `"${esc(guess)}" isn't on our menu.`;
  const label = over ? "Bring the bill" : `Next prompt · ${B.players[nextIdx].emoji} ${esc(B.players[nextIdx].name)}`;
  $("bite-result").innerHTML = `
    <div class="result no pop">
      <h3>${head}</h3>
      <p>${why}</p>
      ${missedChips(6)}
      <div class="row">
        <button class="big-btn" id="bite-next">${label}</button>
        ${reason === "menu" ? `<button class="ghost-btn" id="bite-allow" title="Use this if the table agrees the answer counts">We'll allow it</button>` : ""}
      </div>
    </div>`;
  $("bite-next").onclick = () => {
    sfx.pick();
    if (biteOver()) return endBite();
    newPrompt(nextAlive(B.cur));
  };
  const allow = $("bite-allow");
  if (allow) allow.onclick = () => {
    // the table overrules: give the heart back, score it as a Bread Basket answer, and carry on with the same prompt
    p.hearts++;
    if (out) { p.alive = true; p.outAt = 0; B.outCount--; }
    p.score += TIERS[0].pts; p.served++;
    const e = { display: guess, tier: 0, keys: [norm(guess)], by: B.cur };
    B.prompt.map.set(norm(guess), e);
    B.prompt.entries.push(e);
    B.prompt.served.unshift({ display: guess, tier: 0, by: B.cur });
    B.prompt.turns++;
    sfx.right();
    $("bite-result").innerHTML = "";
    B.cur = nextAlive(B.cur);
    startBiteTurn();
  };
  $("bite-next").focus({ preventScroll: true });
  $("bite-result").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function tableCleared(allGone) {
  const nextIdx = nextAlive(B.cur);
  setFlash("", "");
  $("bite-result").innerHTML = `
    <div class="result ok pop">
      <h3>🍽️ Table cleared</h3>
      <p>${allGone ? "You ate the whole menu. Nothing left to name." : "Everyone survived this one. New prompt, fresh clock."}</p>
      ${missedChips(6)}
      <button class="big-btn" id="bite-next">Next prompt · ${B.players[nextIdx].emoji} ${esc(B.players[nextIdx].name)}</button>
    </div>`;
  $("bite-next").onclick = () => { sfx.pick(); newPrompt(nextIdx); };
  $("bite-next").focus({ preventScroll: true });
}

function endBite() {
  cancelAnimationFrame(biteRaf);
  const n = B.players.length;
  if (n === 1) {
    const p = B.players[0];
    const best = Math.max(+store.get("dr-bite-best") || 0, p.score);
    store.set("dr-bite-best", String(best));
    $("end-kicker").textContent = "Last Bite is over";
    $("end-title").textContent = `${p.score} points`;
    $("end-sub").textContent = `${p.served} answers served · your best is ${best}`;
  } else {
    const survivor = aliveList()[0];
    if (survivor) survivor.score += 150;
    const ranked0 = B.players.slice().sort((a, b) => b.score - a.score);
    const top = ranked0.filter((p) => p.score === ranked0[0].score);
    $("end-kicker").textContent = top.length > 1 ? "It's a tie for chef of the night" : "Chef of the night";
    $("end-title").textContent = top.map((p) => `${p.emoji} ${p.name}`).join(" & ");
    $("end-sub").textContent = survivor ? `${survivor.emoji} ${survivor.name} took the last bite for +150` : "";
  }
  const ranked = B.players.slice().sort((a, b) => b.score - a.score);
  $("bill").innerHTML = `<h3>The Bill</h3>` + ranked.map((p, i) => `
    <div class="bill-row">
      <span class="rk">${i + 1}</span>
      <span class="who">${p.emoji} ${esc(p.name)}</span>
      <span class="dishes">${p.served} served · ${p.alive ? "❤️".repeat(p.hearts) : "💀"}</span>
      <span class="tot">${p.score}</span>
    </div>`).join("");
  show("scr-end");
  sfx.win();
  confetti();
}

/* ---------- wiring ---------- */
$("bite-form").addEventListener("submit", (e) => { e.preventDefault(); submitBite(); });
$("bite-quit").onclick = () => { cancelAnimationFrame(biteRaf); biteLocked = true; show("scr-setup"); renderSeats(); };
$("mode-seg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.mode;
  [...$("mode-seg").children].forEach((c) => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
  $("quiz-opts").hidden = mode !== "quiz";
  $("quiz-opts").style.display = mode === "quiz" ? "flex" : "none";
  $("bite-opts").hidden = mode !== "bite";
  sfx.pick();
});
$("hearts-seg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  heartsEach = +b.dataset.h;
  [...$("hearts-seg").children].forEach((c) => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
});
$("start-btn").onclick = () => { lastMode = mode; mode === "bite" ? startBite() : startGame(); };
$("again-btn").onclick = () => (lastMode === "bite" ? startBite() : startGame());
function paintMute() { const t = muted ? "🔇" : "🔊"; $("mute-btn").textContent = t; $("bite-mute").textContent = t; }
$("bite-mute").onclick = () => { muted = !muted; store.set("dr-muted", muted ? "1" : "0"); paintMute(); };
paintMute();
